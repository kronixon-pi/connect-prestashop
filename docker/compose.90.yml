# PrestaShop 9.0.3 (PHP 8.4) + MariaDB 10.11 — `make up PS=90`.
# Run through scripts/compose.sh (make does): it pins the images from docker/images.lock.
name: kx-ps90
x-kx-ps-tag: "9.0.3-8.4"
services:
  db:
    extends: { file: compose.common.yml, service: db }
  ps:
    extends: { file: compose.common.yml, service: ps }
    image: ${PS_IMAGE:?run through scripts/compose.sh, which pins it from docker/images.lock}
    depends_on: { db: { condition: service_healthy } }
    environment: { PS_DOMAIN: "localhost:${PS_PORT:-8090}" }
    ports: ["127.0.0.1:${PS_PORT:-8090}:80"]
