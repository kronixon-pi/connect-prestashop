# nginx in front of the PrestaShop PHP-FPM image (docker/compose.91fpm.yml). nginx has no copy of the
# shop's files (a volume shared over /var/www/html makes the image's auto-install fail), so it serves
# no static files: a *.php path goes to that script, the back office to admin-dev/index.php, anything
# else to index.php (friendly URLs), all to PHP-FPM on 127.0.0.1:9000 (same network). Enough for the
# API, the cron URL and page views, which is what this leg tests.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 128m;

    set $shop /var/www/html;
    set $script /index.php;
    set $path_info "";

    location ~ /\. {
        deny all;
    }

    location ~ ^(?<php>.+?\.php)(?<rest>/.*)?$ {
        set $script $php;
        set $path_info $rest;
        include /etc/nginx/conf.d/kx-fastcgi.inc;
    }

    location /admin-dev/ {
        set $script /admin-dev/index.php;
        include /etc/nginx/conf.d/kx-fastcgi.inc;
    }

    location / {
        include /etc/nginx/conf.d/kx-fastcgi.inc;
    }
}
