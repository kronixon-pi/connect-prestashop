# PrestaShop 8.1.7 (PHP 8.1) + MariaDB 10.11 — `make up PS=81`.
name: kx-ps81
services:
  db:
    extends: { file: compose.common.yml, service: db }
  ps:
    extends: { file: compose.common.yml, service: ps }
    image: prestashop/prestashop:${PS_TAG:-8.1.7-8.1-apache}
    depends_on: { db: { condition: service_healthy } }
    environment: { PS_DOMAIN: "localhost:${PS_PORT:-8081}" }
    ports: ["127.0.0.1:${PS_PORT:-8081}:80"]
