# PrestaShop 8.2.8 (PHP 8.1) + MariaDB 10.11 — `make up PS=82`.
name: kx-ps82
services:
  db:
    extends: { file: compose.common.yml, service: db }
  ps:
    extends: { file: compose.common.yml, service: ps }
    image: prestashop/prestashop:${PS_TAG:-8.2.8-8.1-apache}
    depends_on: { db: { condition: service_healthy } }
    environment: { PS_DOMAIN: "localhost:${PS_PORT:-8082}" }
    ports: ["127.0.0.1:${PS_PORT:-8082}:80"]
